<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Jumeau Numérique - Bras Robotique 4 DOF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <!-- A-Frame library -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script>
    // Composant pour générer la texture de sécurité jaune/noire (rayures obliques)
    AFRAME.registerComponent('hazard-texture', {
      init: function () {
        const canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');

        // Fond jaune de sécurité
        ctx.fillStyle = '#f1c40f';
        ctx.fillRect(0, 0, 128, 128);

        // Rayures noires inclinées à 45°
        ctx.fillStyle = '#1c1c1c';
        ctx.lineWidth = 24;
        for (let i = -128; i < 256; i += 48) {
          ctx.beginPath();
          ctx.moveTo(i, 0);
          ctx.lineTo(i + 128, 128);
          ctx.stroke();
        }

        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(4, 1);

        const mesh = this.el.getObject3D('mesh');
        if (mesh) {
          mesh.material.map = texture;
          mesh.material.needsUpdate = true;
        }
      }
    });

    // Composant d'animation démo du bras (simulation cinématique directe)
    AFRAME.registerComponent('robot-arm-demo', {
      init: function () {
        this.baseJoint = document.querySelector('#joint-base');
        this.shoulderJoint = document.querySelector('#joint-shoulder');
        this.elbowJoint = document.querySelector('#joint-elbow');
        this.wristJoint = document.querySelector('#joint-wrist');
        this.fingerLeft = document.querySelector('#finger-left');
        this.fingerRight = document.querySelector('#finger-right');
      },
      tick: function (time) {
        const t = time * 0.001; // Temps en secondes

        // Rotation base : -45° à +45°
        const baseAngle = Math.sin(t * 0.8) * 45;
        this.baseJoint.setAttribute('rotation', `0 ${baseAngle} 0`);

        // Articulation épaule (pitch) : -20° à +25°
        const shoulderAngle = Math.sin(t * 1.2) * 25;
        this.shoulderJoint.setAttribute('rotation', `${shoulderAngle} 0 0`);

        // Articulation coude (pitch) : -30° à +35°
        const elbowAngle = Math.cos(t * 1.1) * 35;
        this.elbowJoint.setAttribute('rotation', `${elbowAngle} 0 0`);

        // Poignet : rotation axiale
        const wristAngle = Math.sin(t * 2.0) * 40;
        this.wristJoint.setAttribute('rotation', `0 0 ${wristAngle}`);

        // Pince : ouverture / fermeture cyclique
        const gripOffset = 0.04 + Math.sin(t * 1.5) * 0.025;
        this.fingerLeft.setAttribute('position', `${-gripOffset} 0.08 0`);
        this.fingerRight.setAttribute('position', `${gripOffset} 0.08 0`);
      }
    });
  </script>
</head>
<body style="margin: 0; overflow: hidden;">
  <a-scene robot-arm-demo background="color: #1e272c">
    
    <!-- Caméra utilisateur (positionnée à hauteur d'yeux en retrait) -->
    <a-entity position="0 1.2 1.8">
      <a-camera look-controls="pointerLockEnabled: false"></a-camera>
    </a-entity>

    <!-- Éclairages de scène -->
    <a-entity light="type: ambient; color: #777"></a-entity>
    <a-entity light="type: directional; color: #fff; intensity: 0.9" position="2 4 3"></a-entity>

    <!-- ==================== SURFACE INDUSTRIELLE ==================== -->
    <a-entity position="0 0 0">
      <!-- Dalle principale grise -->
      <a-box position="0 0.45 0" width="1.6" height="0.9" depth="1.6" color="#3a4045" roughness="0.8"></a-box>
      <!-- Plateau de travail supérieur -->
      <a-box position="0 0.905 0" width="1.4" height="0.01" depth="1.4" color="#2c3136" roughness="0.6"></a-box>

      <!-- Lignes de sécurité hachurées jaune/noir (4 côtés) -->
      <a-plane position="0 0.911 0.75" rotation="-90 0 0" width="1.6" height="0.1" hazard-texture></a-plane>
      <a-plane position="0 0.911 -0.75" rotation="-90 180 0" width="1.6" height="0.1" hazard-texture></a-plane>
      <a-plane position="-0.75 0.911 0" rotation="-90 90 0" width="1.6" height="0.1" hazard-texture></a-plane>
      <a-plane position="0.75 0.911 0" rotation="-90 -90 0" width="1.6" height="0.1" hazard-texture></a-plane>
    </a-entity>

    <!-- ==================== BRAS ROBOTIQUE BLANC (4 DOF) ==================== -->
    <!-- Positionné sur la table à Y=0.91 -->
    <a-entity position="0 0.91 0">

      <!-- AXE 1 : BASE (Rotation Y) -->
      <a-entity id="joint-base" position="0 0 0">
        <!-- Embase fixe & moteur azimut -->
        <a-cylinder radius="0.14" height="0.04" position="0 0.02 0" color="#e0e0e0" roughness="0.3"></a-cylinder>
        <a-cylinder radius="0.09" height="0.08" position="0 0.08 0" color="#ffffff" roughness="0.25"></a-cylinder>

        <!-- AXE 2 : ÉPAULE (Pivot X à Y=0.12) -->
        <a-entity id="joint-shoulder" position="0 0.12 0">
          <a-sphere radius="0.06" color="#d5d8dc"></a-sphere>
          <!-- Premier membre (Humerus) -->
          <a-box width="0.06" height="0.4" depth="0.06" position="0 0.2 0" color="#ffffff" roughness="0.25"></a-box>

          <!-- AXE 3 : COUDE (Pivot X à Y=0.4 du membre précédent) -->
          <a-entity id="joint-elbow" position="0 0.4 0">
            <a-sphere radius="0.05" color="#d5d8dc"></a-sphere>
            <!-- Deuxième membre (Avant-bras) -->
            <a-box width="0.05" height="0.35" depth="0.05" position="0 0.175 0" color="#ffffff" roughness="0.25"></a-box>

            <!-- AXE 4 : POIGNET & PINCE (Pivot Z ou Y) -->
            <a-entity id="joint-wrist" position="0 0.35 0">
              <a-cylinder radius="0.035" height="0.04" position="0 0.02 0" color="#bdc3c7"></a-cylinder>
              <a-box width="0.1" height="0.02" depth="0.03" position="0 0.05 0" color="#ffffff"></a-box>

              <!-- Mâchoires de la pince (ouverture symétrique) -->
              <a-box id="finger-left" width="0.015" height="0.07" depth="0.025" position="-0.04 0.08 0" color="#e0e0e0"></a-box>
              <a-box id="finger-right" width="0.015" height="0.07" depth="0.025" position="0.04 0.08 0" color="#e0e0e0"></a-box>
            </a-entity>

          </a-entity> <!-- Fin Coude -->
        </a-entity> <!-- Fin Épaule -->
      </a-entity> <!-- Fin Base -->

    </a-entity>

    <!-- Sol ambiant -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="30" height="30" color="#111417" roughness="0.9"></a-plane>

  </a-scene>
</body>
</html>
