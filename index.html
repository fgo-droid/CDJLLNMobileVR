<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>LEGO VR - CoderDojo</title>
    <!-- Chargement du moteur A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Ciel gris clair -->
      <a-sky color="#ECECEC"></a-sky>

      <!-- Sol pour situer l'espace -->
      <a-plane position="0 0 -4" rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>

      <!-- Brique LEGO 2x4 Rouge -->
      <a-entity id="lego-brick" position="0 1 -3" rotation="0 25 0">
        <!-- Corps principal -->
        <a-box 
          width="3.2" height="0.96" depth="1.6" 
          color="#D11A2A" 
          roughness="0.3" metalness="0.1">
        </a-box>

        <!-- Rangée avant de 4 tenons -->
        <a-cylinder position="-1.2 0.58  0.4" radius="0.25" height="0.2" color="#D11A2A" roughness="0.3"></a-cylinder>
        <a-cylinder position="-0.4 0.58  0.4" radius="0.25" height="0.2" color="#D11A2A" roughness="0.3"></a-cylinder>
        <a-cylinder position=" 0.4 0.58  0.4" radius="0.25" height="0.2" color="#D11A2A" roughness="0.3"></a-cylinder>
        <a-cylinder position=" 1.2 0.58  0.4" radius="0.25" height="0.2" color="#D11A2A" roughness="0.3"></a-cylinder>

        <!-- Rangée arrière de 4 tenons -->
        <a-cylinder position="-1.2 0.58 -0.4" radius="0.25" height="0.2" color="#D11A2A" roughness="0.3"></a-cylinder>
        <a-cylinder position="-0.4 0.58 -0.4" radius="0.25" height="0.2" color="#D11A2A" roughness="0.3"></a-cylinder>
        <a-cylinder position=" 0.4 0.58 -0.4" radius="0.25" height="0.2" color="#D11A2A" roughness="0.3"></a-cylinder>
        <a-cylinder position=" 1.2 0.58 -0.4" radius="0.25" height="0.2" color="#D11A2A" roughness="0.3"></a-cylinder>
      </a-entity>
    </a-scene>
  </body>
</html>
