<!-- Brique LEGO 2x4 Rouge -->
<a-entity id="lego-brick" position="0 1 -3" rotation="0 25 0">
  
  <!-- Corps principal de la brique (largeur: 3.2, hauteur: 0.96, profondeur: 1.6) -->
  <a-box 
    width="3.2" height="0.96" depth="1.6" 
    color="#D11A2A" 
    roughness="0.3" metalness="0.1">
  </a-box>

  <!-- Rangée avant de 4 tenons (studs) -->
  <!-- Y = 0.48 (demi-hauteur) + 0.1 (demi-hauteur du tenon) = 0.58 -->
  <a-cylinder position="-1.2 0.58  0.4" radius="0.25" height="0.2" color="#D11A2A" roughness="0.3"></a-cylinder>
  <a-cylinder position="-0.4 0.58  0.4" radius="0.25" height="0.2" color="#D11A2A" roughness="0.3"></a-cylinder>
  <a-cylinder position=" 0.4 0.58  0.4" radius="0.25" height="0.2" color="#D11A2A" roughness="0.3"></a-cylinder>
  <a-cylinder position=" 1.2 0.58  0.4" radius="0.25" height="0.2" color="#D11A2A" roughness="0.3"></a-cylinder>

  <!-- Rangée arrière de 4 tenons -->
  <a-cylinder position="-1.2 0.58 -0.4" radius="0.25" height="0.2" color="#D11A2A" roughness="0.3"></a-cylinder>
  <a-cylinder position="-0.4 0.58 -0.4" radius="0.25" height="0.2" color="#D11A2A" roughness="0.3"></a-cylinder>
  <a-cylinder position=" 0.4 0.58 -0.4" radius="0.25" height="0.2" color="#D11A2A" roughness="0.3"></a-cylinder>
  <a-cylinder position=" 1.2 0.58 -0.4" radius="0.25" height="0.2" color="#D11A2A" roughness="0.3"></a-cylinder>

</a-entity>
