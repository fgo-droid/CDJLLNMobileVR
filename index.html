<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Jumeau Numérique Réaliste - Bras Robotique 4 DOF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script>
    // Texture de sécurité industrielle réaliste
    AFRAME.registerComponent('hazard-texture', {
      init: function () {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');

        // Fond jaune de sécurité
        ctx.fillStyle = '#f39c12';
        ctx.fillRect(0, 0, 256, 256);

        // Larges bandes noires inclinées à 45°
        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = 42;
        for (let offset = -256; offset < 512; offset += 84) {
          ctx.beginPath();
          ctx.moveTo(offset, 0);
          ctx.lineTo(offset + 256, 256);
          ctx.stroke();
        }

        // Liseré noir extérieur
        ctx.lineWidth = 6;
        ctx.strokeRect(0, 0, 256, 256);

        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(6, 1);

        const mesh = this.el.getObject3D('mesh');
        if (mesh) {
          mesh.material.map = texture;
          mesh.material.needsUpdate = true;
        }
      }
    });

    // Animation de démonstration mise à jour pour le nouveau modèle
    AFRAME.registerComponent('robot-arm-demo', {
      init: function () {
        this.baseJoint = document.querySelector('#joint-base-swivel');
        this.shoulderJoint = document.querySelector('#joint-shoulder');
        this.elbowJoint = document.querySelector('#joint-elbow');
        this.fingerServo = document.querySelector('#finger-servo-axis');
        this.jawLeft = document.querySelector('#jaw-left');
        this.jawRight = document.querySelector('#jaw-right');
      },
      tick: function (time) {
        const t = time * 0.001;

        // Servo 1 (Azimut base) : rotation horizontale
        const baseAngle = Math.sin(t * 0.7) * 40;
        this.baseJoint.setAttribute('rotation', `0 ${baseAngle} 0`);

        // Servo 2 (Épaule - Segment 1) : levage
        const shoulderAngle = (Math.sin(t * 1.0) * 15) - 5;
        this.shoulderJoint.setAttribute('rotation', `${shoulderAngle} 0 0`);

        // Servo 3 (Coude - Segment 2) : extension
        const elbowAngle = (Math.cos(t * 1.1) * 20) + 10;
        this.elbowJoint.setAttribute('rotation', `${elbowAngle} 0 0`);

        // Servo 4 (Pince - Perpendiculaire) : oscillation
        const wristTilt = Math.sin(t * 1.8) * 15;
        this.fingerServo.setAttribute('rotation', `0 ${wristTilt} 0`);

        // Pince : écartement des mors
        const jawSpan = 0.02 + Math.abs(Math.sin(t * 1.5)) * 0.035;
        this.jawLeft.setAttribute('position', `${-jawSpan} 0.08 0`);
        this.jawRight.setAttribute('position', `${jawSpan} 0.08 0`);
      }
    });
  </script>
</head>
<body style="margin: 0; overflow: hidden;">
  <a-scene robot-arm-demo background="color: #1a1e21">

    <!-- Caméra utilisateur (légèrement plus basse et reculée pour le nouveau bras) -->
    <a-entity position="0 1.0 1.9">
      <a-camera look-controls="pointerLockEnabled: false"></a-camera>
    </a-entity>

    <!-- Éclairage d'atelier -->
    <a-entity light="type: ambient; color: #999"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 0.9" position="3 5 3"></a-entity>
    <a-entity light="type: directional; color: #667; intensity: 0.5" position="-3 3 -2"></a-entity>

    <!-- SURFACE INDUSTRIELLE & SOL -->
    <a-entity position="0 0 0">
      <!-- Bâti technique gris anthracite -->
      <a-box position="0 0.425 0" width="1.6" height="0.85" depth="1.6" color="#2c3e50" roughness="0.9"></a-box>
      <!-- Plateau de travail supérieur -->
      <a-box position="0 0.855 0" width="1.36" height="0.01" depth="1.36" color="#1c2833" roughness="0.6"></a-box>

      <!-- Bandes larges de sécurité à 45° -->
      <a-plane position="0 0.862 0.72" rotation="-90 0 0" width="1.6" height="0.16" hazard-texture></a-plane>
      <a-plane position="0 0.862 -0.72" rotation="-90 180 0" width="1.6" height="0.16" hazard-texture></a-plane>
      <a-plane position="-0.72 0.862 0" rotation="-90 90 0" width="1.6" height="0.16" hazard-texture></a-plane>
      <a-plane position="0.72 0.862 0" rotation="-90 -90 0" width="1.6" height="0.16" hazard-texture></a-plane>
    </a-entity>

    <!-- BRAS ROBOTIQUE BLANC FIDÈLE (4 DOF) -->
    <!-- Posé directement sur le plateau (Y=0.86) -->
    <a-entity position="0 0.86 0">

      <!-- BASE FINE & SERVO 1 D'AZIMUT (Visible) -->
      <a-cylinder radius="0.13" height="0.02" position="0 0.01 0" color="#e0e0e0" roughness="0.4"></a-cylinder>
      <!-- Corps du Servo 1 encastré -->
      <a-box width="0.04" height="0.07" depth="0.08" position="0 0.035 -0.01" color="#333" roughness="0.3"></a-box>
      <!-- Axe mobile du servo (Pivot azimut) -->
      <a-entity id="joint-base-swivel" position="0 0.07 -0.01">
        
        <!-- Palette de fixation sur l'axe du servo -->
        <a-cylinder radius="0.02" height="0.005" color="#555" roughness="0.3"></a-cylinder>

        <!-- SERVO 2 : Épaule (Corps du servo blanc) & SEGMENT 1 (Bras inférieur) -->
        <a-entity id="joint-shoulder" position="0 0.005 0">
          
          <!-- Corps du servo 2 (Blanc, à 90°) -->
          <a-box width="0.09" height="0.04" depth="0.07" position="0 0.04 0" color="#fcfcfc" roughness="0.3"></a-box>
          
          <!-- Palette noire (Palonnier) de l'épaule -->
          <a-box width="0.012" height="0.05" depth="0.005" position="-0.048 0.04 0" color="#1a1a1a" roughness="0.2"></a-box>

          <!-- Segment 1 : corps principal -->
          <a-box width="0.05" height="0.36" depth="0.05" position="0 0.18 0" color="#ffffff" roughness="0.25"></a-box>

          <!-- SERVO 3 : Coude & SEGMENT 2 (Avant-bras) -->
          <a-entity id="joint-elbow" position="0 0.36 0">
            
            <!-- Corps du servo 3 (Blanc, horizontal) -->
            <a-box width="0.05" height="0.08" depth="0.04" position="0 0.01 0" color="#fcfcfc" roughness="0.3"></a-box>
            
            <!-- Palette noire (Palonnier) du coude -->
            <a-box width="0.01" height="0.045" depth="0.005" position="-0.028 0.01 0" color="#1a1a1a" roughness="0.2"></a-box>

            <!-- Segment 2 : corps principal -->
            <a-box width="0.04" height="0.32" depth="0.04" position="0 0.16 0" color="#ffffff" roughness="0.25"></a-box>

            <!-- SERVO 4 & SEGMENT 3 : Pince à moteur perpendiculaire -->
            <a-entity position="0 0.32 0">
              
              <!-- Corps du servo 4 (Pince, perpendiculaire) -->
              <a-cylinder radius="0.02" height="0.08" rotation="0 0 90" position="0 0.015 0" color="#4a4a4a" roughness="0.3"></a-cylinder>

              <!-- Axe mobile commandé par le servo perpendiculaire -->
              <a-entity id="finger-servo-axis" position="0 0.015 0">
                
                <!-- Paume / Traverse de fixation -->
                <a-box width="0.09" height="0.015" depth="0.035" position="0 0.05 0" color="#ffffff" roughness="0.25"></a-box>

                <!-- Doigt gauche (Mors fixe ou mobile) -->
                <a-entity id="jaw-left" position="-0.035 0.09 0">
                  <a-box width="0.012" height="0.06" depth="0.025" color="#e0e0e0" roughness="0.3"></a-box>
                  <a-box width="0.012" height="0.02" depth="0.02" position="0.008 0.025 0" rotation="0 0 -25" color="#333" roughness="0.3"></a-box>
                </a-entity>

                <!-- Doigt droit ("Pouce" opposé) -->
                <a-entity id="jaw-right" position="0.035 0.09 0">
                  <a-box width="0.012" height="0.06" depth="0.025" color="#e0e0e0" roughness="0.3"></a-box>
                  <a-box width="0.012" height="0.02" depth="0.02" position="-0.008 0.025 0" rotation="0 0 25" color="#333" roughness="0.3"></a-box>
                </a-entity>
              </a-entity> <!-- Fin axe pince -->

            </a-entity> <!-- Fin Segment 3 -->
          </a-entity> <!-- Fin Segment 2 (Coude) -->
        </a-entity> <!-- Fin Segment 1 (Épaule) -->
      </a-entity> <!-- Fin Base swivel -->

    </a-entity>

    <!-- Sol de fond -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="30" depth="30" color="#0e1113" roughness="0.95"></a-plane>

  </a-scene>
</body>
</html>
